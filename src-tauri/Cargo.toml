[package]
name = "nchat"
version = "0.1.0-beta.1"
description = "Private multi-identity Nostr messenger for the ndisc suite"
authors = ["xjmzx"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nchat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Relay probe carried over from nping: blocking WebSocket + NIP-11 over HTTP,
# rustls throughout so wss:// works with no system OpenSSL dependency.
tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2", features = ["tls"] }
# Nostr protocol. Default features are ring + rustls-tls-webpki-roots, which
# keeps the no-OpenSSL property above. NIP-17/44/59 live in `nostr` and are
# re-exported through the sdk.
nostr-sdk = "0.45"
# nostr-sdk only turns on std/rand/os-rng, so the NIPs this app is built around
# are absent unless we depend on `nostr` directly and ask for them. nip59 (gift
# wrap) pulls nip44; nip04 is read-only legacy support for existing senders.
nostr = { version = "0.45", features = ["std", "nip04", "nip44", "nip59"] }
# Secret keys live in the OS keychain, never on disk and never in the webview.
# Default `v1` feature pulls the native store per platform: Keychain on macOS,
# Credential Manager on Windows, secret-service (zbus) on Linux.
keyring = "4"
